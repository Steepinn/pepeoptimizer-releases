name: Build and publish PepeOptimazer

on:
  push:
    paths: [release-request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pepe-windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-feed
      - name: Read reviewed source request
        id: source
        shell: pwsh
        run: |
          $request = Get-Content release-feed/release-request.json -Raw | ConvertFrom-Json
          "commit=$($request.source_commit)" >> $env:GITHUB_OUTPUT
          "archive=$($request.archive_path)" >> $env:GITHUB_OUTPUT
          "sha256=$($request.source_sha256)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: Steepinn/pepeoptimizer
          ref: ${{ steps.source.outputs.commit }}
          token: ${{ secrets.LICENSE_STORE_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify and extract private sources
        shell: pwsh
        env:
          SOURCE_ARCHIVE: ${{ steps.source.outputs.archive }}
          SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          @'
          import hashlib, json, os, pathlib, zipfile
          source = pathlib.Path('private-source') / os.environ['SOURCE_ARCHIVE']
          manifest = json.loads((source / 'manifest.json').read_text())
          output = pathlib.Path('source.zip')
          with output.open('wb') as target:
              for index in range(manifest['chunks']):
                  target.write((source / f'{index:04d}.bin').read_bytes())
          assert hashlib.sha256(output.read_bytes()).hexdigest() == os.environ['SOURCE_SHA256']
          with zipfile.ZipFile(output) as archive:
              assert all(not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts for name in archive.namelist())
              archive.extractall('app')
          '@ | python -
      - name: Install matching build dependencies
        working-directory: app
        run: python -m pip install -r build-requirements.txt
      - name: Verify updates, background mode and encrypted activation
        working-directory: app
        run: python -m unittest tests.test_app_update tests.test_background tests.test_github_activation -v
      - name: Install Inno Setup compiler
        run: choco install innosetup --no-progress --yes
      - name: Build and scan public installer
        working-directory: app
        run: python tools/build_release.py
      - name: Keep verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PepeOptimazer-verified-installer
          path: |
            app/dist/PepeOptimazerSetup.exe
            app/dist/release-manifest.json
          retention-days: 7
      - name: Publish verified release
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py

